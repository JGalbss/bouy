# The native tier of the speed spike: NBody and Richards in Rust, called from Erlang as NIFs
# that run in time slices. Hand-written Rust stands in for what a Cranelift backend would
# emit from the typed TypeScript. This crate is its own workspace, so the Bouy workspace,
# whose lints deny unsafe code, does not build it.
[package]
name = "bouy-speed-native"
version = "0.0.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
itoa = "1"
regex = "1"
ryu = "1"

[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
