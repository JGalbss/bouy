[package]
name = "buoy-bench"
description = "Runs each Buoy benchmark next to an equivalent plain Node program, also on Bun, and records the results."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "buoy-bench"
path = "src/main.rs"

[dependencies]
clap = { workspace = true, features = ["env"] }
nix = { version = "0.31", default-features = false, features = ["resource", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
