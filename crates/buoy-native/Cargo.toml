[package]
name = "buoy-native"
description = "The NIF library of the runtime: the zlib, brotli, and zstd codecs of Node's zlib module, WebAssembly on Wasmtime, and the SQLite of node:sqlite."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# The BEAM loads the library with erlang:load_nif. crates/buoy-cli/build.rs builds it and
# embeds it in the buoy binary.
[lib]
name = "buoy_native"
crate-type = ["cdylib"]

[dependencies]
# Allocations go through enif_alloc, so erlang:memory and BUOY_MAX_MEMORY count them.
rustler = { version = "0.39", default-features = false, features = [
  "allocator",
  "nif_version_2_15",
] }
# zlib in safe Rust, with zlib's C API, messages, and flush modes.
libz-rs-sys = { version = "=0.6.8", default-features = false, features = ["std", "rust-allocator"] }
# Brotli in safe Rust.
brotli = { version = "9.0.0", default-features = false, features = ["std"] }
brotli-decompressor = { version = "~6.0", default-features = false, features = ["std"] }
# libzstd 1.5.7, the reference library that Node bundles: no Rust encoder has its levels.
# experimental gives ZSTD_customMem, so libzstd allocates through enif_alloc.
zstd-sys = { version = "2.1.1", default-features = false, features = ["experimental"] }
# WebAssembly: Cranelift compiles a module, and an async store runs it in time slices.
wasmtime = { version = "49.0.3", default-features = false, features = [
  "anyhow",
  "async",
  "cranelift",
  "debug",
  "gc",
  "gc-drc",
  "parallel-compilation",
  "runtime",
  "std",
  "threads",
] }

# SQLite 3.53, built from the amalgamation; .cargo/config.toml adds the options of Node's
# deps/sqlite that libsqlite3-sys does not set, such as the session extension.
libsqlite3-sys = { version = "=0.38.2", features = ["bundled"] }

[lints]
workspace = true
