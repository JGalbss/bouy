[package]
name = "buoy-native"
description = "The NIF library of the runtime: JSON.parse, the RegExp matcher, the CLDR data of Intl, the fs calls that ERTS lacks, and the zlib, brotli, and zstd codecs of Node's zlib module."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

# The BEAM loads the library with erlang:load_nif. crates/buoy-cli/build.rs builds it and
# embeds it in the buoy binary.
[lib]
name = "buoy_native"
crate-type = ["cdylib"]

[dependencies]
# The system calls of fs that std lacks: utimensat, lchmod, access, and statfs.
libc = "0.2"
memchr = "2"
# Allocations go through enif_alloc, so erlang:memory and BUOY_MAX_MEMORY count them.
rustler = { version = "0.39", default-features = false, features = [
  "allocator",
  "nif_version_2_15",
] }
# ICU4X, the Unicode Consortium's ICU in Rust, with CLDR compiled in, for Intl.
icu_locale = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_calendar = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_casemap = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_collator = { version = "2.3", default-features = false, features = ["compiled_data"] }
icu_decimal = { version = "2.3", default-features = false, features = ["compiled_data", "unstable"] }
icu_segmenter = { version = "2.3", default-features = false, features = ["compiled_data"] }
# Data that every scheduler thread of the VM shares: Arc instead of Rc.
icu_provider = { version = "2.3", default-features = false, features = ["sync"] }
# zlib in safe Rust, with zlib's C API, messages, and flush modes.
libz-rs-sys = { version = "=0.6.8", default-features = false, features = ["std", "rust-allocator"] }
# Brotli in safe Rust.
brotli = { version = "9.0.0", default-features = false, features = ["std"] }
brotli-decompressor = { version = "~6.0", default-features = false, features = ["std"] }
# libzstd 1.5.7, the reference library that Node bundles: no Rust encoder has its levels.
# experimental gives ZSTD_customMem, so libzstd allocates through enif_alloc.
zstd-sys = { version = "2.1.1", default-features = false, features = ["experimental"] }

[lints]
workspace = true
