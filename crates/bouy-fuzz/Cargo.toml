[package]
name = "bouy-fuzz"
description = "The differential fuzz campaign: generates seeded programs, runs them on Node and on Bouy, and keeps each silent mismatch as a minimized case in tests/fuzz."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "bouy-fuzz"
path = "src/main.rs"

[dependencies]
bouy-compiler.workspace = true
bouy-suites = { path = "../bouy-suites" }
clap = { workspace = true, features = ["env"] }

[lints]
workspace = true
