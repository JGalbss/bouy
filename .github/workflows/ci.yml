name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          rebar3-version: "3.27"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # pnpm and Node run only the dev tools (turbo, oxfmt, oxlint). Bouy itself runs on BEAM.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # The upstream suites of docs/design/testing.md section 10. A pull request runs the
  # selection of section 3.7 and compares with the expectation file of its base. A push to
  # main runs every id until the nightly job exists.
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          rebar3-version: "3.27"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - uses: actions/cache@v4
        with:
          path: ~/.cache/bouy/test262-*
          key: test262-${{ hashFiles('tests/test262/config.json') }}
      - run: cargo build --release -p bouy-cli -p bouy-suites
      - name: Run test262
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          ACCEPT: ${{ contains(github.event.pull_request.labels.*.name, 'accept-regression') }}
        run: |
          base="$BEFORE"
          select="all"
          if [ "$EVENT" = "pull_request" ]; then base="$BASE"; select="pr"; fi
          git show "$base:tests/test262/expectations.txt" > "$RUNNER_TEMP/base.txt" 2>/dev/null || rm -f "$RUNNER_TEMP/base.txt"
          accept=""
          if [ "$ACCEPT" = "true" ]; then accept="--accept-regressions"; fi
          target/release/bouy-suites test262 --select "$select" --base "$RUNNER_TEMP/base.txt" $accept
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test262
          path: target/suites/test262
      # Node's own tests, vendored in tests/node/suite (section 5.7). The nightly job runs
      # every id.
      - name: Run Node's tests
        if: success() || failure()
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          ACCEPT: ${{ contains(github.event.pull_request.labels.*.name, 'accept-regression') }}
        run: |
          base="$BEFORE"
          select="all"
          if [ "$EVENT" = "pull_request" ]; then base="$BASE"; select="pr"; fi
          git show "$base:tests/node/expectations.txt" > "$RUNNER_TEMP/node-base.txt" 2>/dev/null || rm -f "$RUNNER_TEMP/node-base.txt"
          accept=""
          if [ "$ACCEPT" = "true" ]; then accept="--accept-regressions"; fi
          target/release/bouy-suites node --select "$select" --base "$RUNNER_TEMP/node-base.txt" $accept
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node
          path: target/suites/node
      # The comment of section 6. This job holds no write token, so comment.yml posts it.
      - name: Write the pull request comment
        if: always() && github.event_name == 'pull_request'
        env:
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/comment"
          {
            echo "<!-- bouy-suites -->"
            echo "## Upstream suites"
            echo
            cat target/suites/*/comment.md 2>/dev/null || echo "The suites wrote no report. The log of the suites job says why."
          } > "$RUNNER_TEMP/comment/body.md"
          echo "$NUMBER" > "$RUNNER_TEMP/comment/number"
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'pull_request'
        with:
          name: suites-comment
          path: ${{ runner.temp }}/comment

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Conventional Commit subjects
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          range="$BEFORE..$SHA"
          if [ "$EVENT" = "pull_request" ]; then range="$BASE..$HEAD"; fi
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then range="$SHA"; fi
          sh scripts/check-commits.sh --range "$range"
