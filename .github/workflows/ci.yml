name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          rebar3-version: "3.27"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # pnpm and Node run only the dev tools (turbo, oxfmt, oxlint). Bouy itself runs on BEAM.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Conventional Commit subjects
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          range="$BEFORE..$SHA"
          if [ "$EVENT" = "pull_request" ]; then range="$BASE..$HEAD"; fi
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then range="$SHA"; fi
          sh scripts/check-commits.sh --range "$range"
