name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
          - os: ubuntu-latest
            node: 25
          - os: macos-latest
            node: 25
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  commits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - name: Check Conventional Commit subjects
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          range="$BEFORE..$SHA"
          if [ "$EVENT" = "pull_request" ]; then range="$BASE..$HEAD"; fi
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then range="$SHA"; fi
          node scripts/check-commits.ts --range "$range"
