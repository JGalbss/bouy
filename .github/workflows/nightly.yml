# The nightly job of docs/design/testing.md section 10. It holds the performance limits of
# section 5.11 and the full run of Node's tests of section 5.7. test262 still runs in full
# on each push to main.
name: Nightly

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Runs every file of tests/node/suite and compares the run with tests/node/expectations.txt.
  # The job summary holds the report, and the artifact holds the regenerated expectation
  # file and results.json.
  node:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          rebar3-version: "3.27"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - run: cargo build --release -p bouy-cli -p bouy-suites
      - name: Run Node's tests
        run: |
          status=0
          target/release/bouy-suites node --select all > "$RUNNER_TEMP/node.txt" 2>&1 || status=$?
          cat "$RUNNER_TEMP/node.txt"
          {
            echo "## Node's tests"
            echo
            echo '```text'
            cat "$RUNNER_TEMP/node.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: node
          path: target/suites/node

  # Runs every benchmark on one fixed runner type. The cache keeps the last two results of
  # each host, which bouy-bench names after the CPU model. `bouy-bench compare` checks the
  # previous result and this one against the result before both. A metric past its limit in
  # both fails the job, and the last step opens an issue. A metric past its limit in this
  # run only gets a warning.
  bench:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          rebar3-version: "3.27"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      # Node runs the baseline programs of bench/programs only. Bouy runs on BEAM.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: cargo build --release -p bouy-cli -p bouy-bench
      - name: Run the benchmarks
        run: target/release/bouy-bench --runs 5 --bouy target/release/bouy --out "$RUNNER_TEMP/bench"
      - name: Name the host
        id: host
        run: echo "name=$(jq -r .host.name "$RUNNER_TEMP"/bench/*.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/bouy/bench-nightly
          key: bench-nightly-${{ steps.host.outputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bench-nightly-${{ steps.host.outputs.name }}-
      - name: Compare with the limits
        id: compare
        run: |
          history="$HOME/.cache/bouy/bench-nightly"
          files=()
          for name in older last; do
            if [ -f "$history/$name.json" ]; then files+=("$history/$name.json"); fi
          done
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No earlier nightly result of this host, so no comparison ran." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          status=0
          target/release/bouy-bench compare "${files[@]}" "$RUNNER_TEMP"/bench/*.json > "$RUNNER_TEMP/compare.md" 2>&1 || status=$?
          cat "$RUNNER_TEMP/compare.md" | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -q "past once: a warning" "$RUNNER_TEMP/compare.md"; then
            echo "::warning title=Benchmarks::A metric is past its limit in this run only. The job summary lists it."
          fi
          exit "$status"
      - name: Keep this result for the next nights
        if: success() || steps.compare.outcome == 'failure'
        run: |
          history="$HOME/.cache/bouy/bench-nightly"
          mkdir -p "$history"
          if [ -f "$history/last.json" ]; then mv "$history/last.json" "$history/older.json"; fi
          cp "$RUNNER_TEMP"/bench/*.json "$history/last.json"
      - uses: actions/cache/save@v4
        if: success() || steps.compare.outcome == 'failure'
        with:
          path: ~/.cache/bouy/bench-nightly
          key: bench-nightly-${{ steps.host.outputs.name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench
          path: |
            ${{ runner.temp }}/bench
            ${{ runner.temp }}/compare.md
          if-no-files-found: ignore
      - name: Open an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly benchmarks failed"
          {
            echo "The nightly bench job failed: $RUN"
            echo
            cat "$RUNNER_TEMP/compare.md" 2>/dev/null || echo "No comparison ran. The log of the job says why."
          } > "$RUNNER_TEMP/issue.md"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
          fi
